# Local stack: SQL Server + Spring Boot BE.
#   docker compose up -d --build         # start (first run builds the image)
#   docker compose run --rm seed         # load seed.sql (run once, AFTER the backend has started and created tables)
#   docker compose down                  # stop (data kept)   |   docker compose down -v   # stop + wipe DB
# All config comes from environment variables (see .env.example) so the same
# variables can be set later on Render/Railway + Azure SQL.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "${DB_SA_PASSWORD}" -C -Q "IF DB_ID('VaccinationDB') IS NULL CREATE DATABASE VaccinationDB"

  backend:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /vaccination
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=VaccinationDB;encrypt=true;trustServerCertificate=true;loginTimeout=30
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${DB_SA_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.microsoft.sqlserver.jdbc.SQLServerDriver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.SQLServerDialect
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ADVISOR_LLM_PROVIDER: anthropic
      ADVISOR_HISTORY_WINDOW_SIZE: "6"

  # One-shot: docker compose run --rm seed
  seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seed.sql:/seed.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "${DB_SA_PASSWORD}" -C -I -b -f 65001 -i /seed.sql

volumes:
  sqlserver-data:
